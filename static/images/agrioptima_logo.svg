<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Shield Gradient: Deep Forest Sage to Emerald -->
    <linearGradient id="brandShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14362a" />
      <stop offset="50%" stop-color="#1b4d3e" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>

    <!-- Outer Rim Glow Gradient -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2d6a4f" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9" />
    </linearGradient>

    <!-- Primary Sprout Leaf: Vibrant Emerald to Mint -->
    <linearGradient id="leafGradPrimary" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Secondary Leaf: Deep Celadon with Soft Translucency -->
    <linearGradient id="leafGradSecondary" x1="85%" y1="90%" x2="15%" y2="15%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="55%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Soil Strata Wave Gradient -->
    <linearGradient id="soilWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#40916c" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#74c69d" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#52b788" stop-opacity="0.2" />
    </linearGradient>

    <!-- Optimal Point Flare: Amber Glow -->
    <radialGradient id="apexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Emblem Base with Modern Bevel -->
  <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#brandShield)" stroke="url(#rimGlow)" stroke-width="1.25" />

  <!-- 3D Contour Topography / Soil Strata Curves -->
  <path d="M 7 37 C 16 33, 23 41, 41 34" stroke="url(#soilWaveGrad)" stroke-width="1.6" stroke-linecap="round" fill="none" />
  <path d="M 7 41 C 18 38, 28 43, 41 38" stroke="url(#soilWaveGrad)" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Precision Optimization Grid Crosshair (Subtle Tech Coordinate Marks) -->
  <circle cx="24" cy="20" r="14.5" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-dasharray="2 3" />
  <line x1="24" y1="5.5" x2="24" y2="8.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="24" y1="31.5" x2="24" y2="34.5" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="9.5" y1="20" x2="12.5" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="35.5" y1="20" x2="38.5" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Precision Sprout Geometry -->
  <!-- Left Lateral Leaf (Vegetative Canopy) -->
  <path d="M 24 32 C 22.5 25, 13.5 23, 12 16 C 17.5 15, 23 18.5, 24 24 Z" fill="url(#leafGradSecondary)" opacity="0.9" />

  <!-- Right Apex Leaf (Photosynthetic Yield Center) -->
  <path d="M 24 32 C 25.5 22.5, 35.5 19, 35.5 11.5 C 28.5 11.5, 23 17, 24 32 Z" fill="url(#leafGradPrimary)" filter="url(#softGlow)" />

  <!-- Central Vascular Stem / Nutrient Flow Vector -->
  <path d="M 24 36 L 24 21" stroke="#e8f5e9" stroke-width="1.7" stroke-linecap="round" />

  <!-- Apex Yield Optimum Marker (Mitscherlich Peak Yield Target) -->
  <circle cx="24" cy="11.5" r="4.2" fill="url(#apexGlow)" />
  <circle cx="24" cy="11.5" r="2" fill="#ffffff" />
  <circle cx="24" cy="11.5" r="0.8" fill="#1b4d3e" />
</svg>
